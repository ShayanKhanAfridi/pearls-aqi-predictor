# ============================================================
# .github/workflows/hourly_pipeline.yml
#
# Runs EVERY HOUR:
#   1. Feature Pipeline (pipelines/feature_pipeline.py)
#
# NOTE: Inference is NOT scheduled here.
# The Streamlit dashboard (dashboard/app.py) runs inference
# automatically on every page load (cached for 1 hour via
# st.cache_data ttl=3600).
# ============================================================

name: ⏱️ Hourly Feature Pipeline

on:
  schedule:
    - cron: "0 * * * *"   # Every hour at :00
  workflow_dispatch:       # Manual trigger from GitHub UI

jobs:
  feature_pipeline:
    name: 🌫️ Feature Pipeline [v6]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Feature Pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python pipelines/feature_pipeline.py

      - name: Upload feature log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-pipeline-log-${{ github.run_id }}
          path: "*.log"
          retention-days: 3
          if-no-files-found: ignore

      - name: Notify success
        if: success()
        run: echo "✅ Feature pipeline complete at $(date -u). Hopsworks updated."

      - name: Notify failure
        if: failure()
        run: echo "❌ Feature pipeline failed. Dashboard will use stale features until next run."